<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Architecture d'un réseau Zigbee maillé</title><desc id="d">Schéma DomoRepère montrant un coordinateur Zigbee, plusieurs routeurs sur secteur et des terminaux sur pile.</desc>
<rect width="1600" height="900" fill="#f6f8f7"/>
<text x="800" y="82" text-anchor="middle" font-family="Inter,Arial" font-size="44" font-weight="700" fill="#273436">Comment se construit un réseau Zigbee</text>
<text x="800" y="126" text-anchor="middle" font-family="Inter,Arial" font-size="24" fill="#6d7b7d">Coordinateur → routeurs sur secteur → terminaux sur pile</text>
<g stroke="#0d665d" stroke-width="8" opacity=".42" fill="none"><path d="M800 280 L470 470"/><path d="M800 280 L1130 470"/><path d="M470 470 L260 700"/><path d="M470 470 L620 700"/><path d="M1130 470 L980 700"/><path d="M1130 470 L1340 700"/><path d="M470 470 L1130 470"/></g>
<g font-family="Inter,Arial" text-anchor="middle"><circle cx="800" cy="280" r="88" fill="#273436"/><text x="800" y="270" font-size="28" font-weight="800" fill="#fff">COORDINATEUR</text><text x="800" y="308" font-size="21" fill="#e5c995">1 par réseau</text><circle cx="470" cy="470" r="78" fill="#0d665d"/><text x="470" y="462" font-size="27" font-weight="800" fill="#fff">ROUTEUR</text><text x="470" y="497" font-size="19" fill="#eaf5f2">prise / module</text><circle cx="1130" cy="470" r="78" fill="#0d665d"/><text x="1130" y="462" font-size="27" font-weight="800" fill="#fff">ROUTEUR</text><text x="1130" y="497" font-size="19" fill="#eaf5f2">appareil secteur</text><g fill="#c9aa72"><circle cx="260" cy="700" r="68"/><circle cx="620" cy="700" r="68"/><circle cx="980" cy="700" r="68"/><circle cx="1340" cy="700" r="68"/></g><g fill="#273436" font-size="22" font-weight="750"><text x="260" y="693">CAPTEUR</text><text x="260" y="722" font-size="17" font-weight="500">sur pile</text><text x="620" y="693">BOUTON</text><text x="620" y="722" font-size="17" font-weight="500">sur pile</text><text x="980" y="693">CAPTEUR</text><text x="980" y="722" font-size="17" font-weight="500">sur pile</text><text x="1340" y="693">CAPTEUR</text><text x="1340" y="722" font-size="17" font-weight="500">sur pile</text></g></g>
<rect x="310" y="805" width="980" height="58" rx="29" fill="#eaf5f2" stroke="#cfe7e1"/><text x="800" y="842" text-anchor="middle" font-family="Inter,Arial" font-size="22" fill="#273436">Le maillage dépend surtout des routeurs correctement répartis — pas du nombre de capteurs sur pile.</text>
</svg>
