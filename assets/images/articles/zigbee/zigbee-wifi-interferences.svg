<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Coexistence entre Zigbee et Wi-Fi en 2,4 GHz</title><desc id="d">Infographie DomoRepère expliquant que Zigbee et le Wi-Fi 2,4 GHz partagent une même bande de fréquences et qu'il faut limiter le chevauchement.</desc><rect width="1600" height="900" fill="#f6f8f7"/><text x="800" y="85" text-anchor="middle" font-family="Inter,Arial" font-size="44" font-weight="700" fill="#273436">Zigbee et Wi‑Fi partagent la bande 2,4 GHz</text><text x="800" y="130" text-anchor="middle" font-family="Inter,Arial" font-size="24" fill="#6d7b7d">Le but n'est pas de trouver un canal “magique”, mais d'éviter les chevauchements inutiles.</text><g font-family="Inter,Arial"><text x="140" y="245" font-size="28" font-weight="800" fill="#273436">Wi‑Fi 2,4 GHz</text><rect x="140" y="280" width="410" height="120" rx="22" fill="#273436" opacity=".9"/><text x="345" y="352" text-anchor="middle" fill="#fff" font-size="27">canal Wi‑Fi</text><rect x="595" y="280" width="410" height="120" rx="22" fill="#273436" opacity=".72"/><text x="800" y="352" text-anchor="middle" fill="#fff" font-size="27">canal Wi‑Fi</text><rect x="1050" y="280" width="410" height="120" rx="22" fill="#273436" opacity=".55"/><text x="1255" y="352" text-anchor="middle" fill="#fff" font-size="27">canal Wi‑Fi</text><text x="140" y="505" font-size="28" font-weight="800" fill="#0d665d">Zigbee</text><g fill="#0d665d"><rect x="150" y="545" width="70" height="90" rx="15"/><rect x="250" y="545" width="70" height="90" rx="15"/><rect x="350" y="545" width="70" height="90" rx="15"/><rect x="450" y="545" width="70" height="90" rx="15"/><rect x="550" y="545" width="70" height="90" rx="15"/><rect x="650" y="545" width="70" height="90" rx="15"/><rect x="750" y="545" width="70" height="90" rx="15"/><rect x="850" y="545" width="70" height="90" rx="15"/><rect x="950" y="545" width="70" height="90" rx="15"/><rect x="1050" y="545" width="70" height="90" rx="15"/><rect x="1150" y="545" width="70" height="90" rx="15"/><rect x="1250" y="545" width="70" height="90" rx="15"/><rect x="1350" y="545" width="70" height="90" rx="15"/></g><text x="800" y="690" text-anchor="middle" font-size="22" fill="#6d7b7d">Les canaux Zigbee sont beaucoup plus étroits que les canaux Wi‑Fi.</text></g><rect x="270" y="760" width="1060" height="78" rx="20" fill="#eaf5f2" stroke="#cfe7e1"/><text x="800" y="795" text-anchor="middle" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#273436">Conseil pratique</text><text x="800" y="824" text-anchor="middle" font-family="Inter,Arial" font-size="20" fill="#3d4b4d">Fixe d'abord un Wi‑Fi propre et stable, puis ajuste Zigbee seulement si tu as une raison mesurable de le faire.</text></svg>
