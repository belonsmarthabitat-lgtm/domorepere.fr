<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Méthode d'implantation d'un réseau Zigbee dans une maison</title><desc id="d">Schéma DomoRepère montrant le coordinateur éloigné du routeur Wi-Fi, des routeurs Zigbee répartis par zones et les capteurs ajoutés ensuite.</desc><rect width="1600" height="900" fill="#f6f8f7"/><text x="800" y="80" text-anchor="middle" font-family="Inter,Arial" font-size="44" font-weight="700" fill="#273436">Construire le réseau avant d'ajouter tous les capteurs</text><g stroke="#273436" stroke-width="8" fill="#fff"><rect x="220" y="190" width="1160" height="520" rx="14"/><line x1="220" y1="450" x2="1380" y2="450"/><line x1="600" y1="190" x2="600" y2="710"/><line x1="1010" y1="190" x2="1010" y2="710"/></g><g font-family="Inter,Arial" text-anchor="middle"><text x="410" y="240" font-size="20" fill="#6d7b7d">bureau / box internet</text><text x="805" y="240" font-size="20" fill="#6d7b7d">zone centrale</text><text x="1195" y="240" font-size="20" fill="#6d7b7d">chambre / étage</text><circle cx="340" cy="330" r="62" fill="#c9aa72"/><text x="340" y="323" font-size="21" font-weight="800" fill="#273436">Wi‑Fi</text><text x="340" y="350" font-size="16" fill="#273436">routeur/AP</text><circle cx="760" cy="330" r="72" fill="#273436"/><text x="760" y="323" font-size="20" font-weight="800" fill="#fff">COORD.</text><text x="760" y="350" font-size="16" fill="#e5c995">éloigné USB 3</text><circle cx="1135" cy="330" r="62" fill="#0d665d"/><text x="1135" y="323" font-size="20" font-weight="800" fill="#fff">ROUTEUR</text><text x="1135" y="350" font-size="16" fill="#eaf5f2">sur secteur</text><circle cx="430" cy="575" r="62" fill="#0d665d"/><text x="430" y="568" font-size="20" font-weight="800" fill="#fff">ROUTEUR</text><text x="430" y="595" font-size="16" fill="#eaf5f2">sur secteur</text><circle cx="820" cy="575" r="62" fill="#0d665d"/><text x="820" y="568" font-size="20" font-weight="800" fill="#fff">ROUTEUR</text><text x="820" y="595" font-size="16" fill="#eaf5f2">sur secteur</text><circle cx="1190" cy="575" r="58" fill="#c9aa72"/><text x="1190" y="568" font-size="19" font-weight="800" fill="#273436">CAPTEUR</text><text x="1190" y="595" font-size="16" fill="#273436">sur pile</text></g><g stroke="#0d665d" stroke-width="7" stroke-dasharray="16 12" opacity=".55"><line x1="760" y1="330" x2="1135" y2="330"/><line x1="760" y1="330" x2="820" y2="575"/><line x1="820" y1="575" x2="430" y2="575"/><line x1="1135" y1="330" x2="1190" y2="575"/></g><rect x="245" y="760" width="1110" height="80" rx="22" fill="#eaf5f2" stroke="#cfe7e1"/><text x="800" y="795" text-anchor="middle" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#273436">Ordre efficace : coordinateur → routeurs fixes → capteurs et boutons</text><text x="800" y="824" text-anchor="middle" font-family="Inter,Arial" font-size="19" fill="#3d4b4d">Un bon placement vaut souvent plus qu'un répéteur ajouté au hasard.</text></svg>
